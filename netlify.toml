# Konfiguracja Netlify
# Plik ten musi być w głównym folderze repozytorium

[build]
  publish = "."   # Netlify serwuje pliki z głównego katalogu

[[headers]]
  for = "/data/data.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
