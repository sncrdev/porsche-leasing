name: Aktualizacja WIBOR 1M

on:
  schedule:
    - cron: "0 5 * * 1-5"   # pn–pt 5:00 UTC = 7:00 czasu letniego w Polsce (6:00 zimą)
  workflow_dispatch:         # przycisk "Run workflow" do ręcznego uruchomienia

permissions:
  contents: write            # pozwala zapisać data/data.json do repozytorium

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: pip install requests

      - name: Pobranie WIBOR
        run: python .github/workflows/update_data.py

      - name: Zapis zmian
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "Brak zmian w data.json"
          else
            git commit -m "Aktualizacja WIBOR 1M $(date +%F)"
            git push
          fi
